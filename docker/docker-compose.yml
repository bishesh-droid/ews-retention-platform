version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./backend:/app/backend
    environment:
      - DATABASE_URL=sqlite:///./backend/ews_platform.db

  scheduler:
    build: .
    command: python -m backend.services.scheduler
    volumes:
      - ./models:/app/models
      - ./backend:/app/backend

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend