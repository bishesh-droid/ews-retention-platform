name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint
      run: flake8 backend/ --max-line-length=100

    - name: Type check
      run: mypy backend/ --ignore-missing-imports

    - name: Run pytest
      run: |
        export TESTING=true
        export ENVIRONMENT=development
        export DATABASE_URL="sqlite:///:memory:"
        export SECRET_KEY="test-secret-key-min-32-chars-for-testing-only"
        export PYTHONPATH="${PYTHONPATH}:."
        python -m pytest backend/tests -v --tb=short --cov=backend --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-py${{ matrix.python-version }}

  test-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run ESLint
      working-directory: ./frontend
      run: npm run lint

    - name: Build
      working-directory: ./frontend
      run: CI=false npm run build

    - name: Test
      working-directory: ./frontend
      run: npm test -- --watchAll=false --coverage --passWithNoTests

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Security scan
      run: |
        pip install bandit
        bandit -r backend/ -ll -b .bandit.baseline

    - name: Secret detection
      run: |
        pip install detect-secrets
        detect-secrets scan --baseline .secrets.baseline

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker compose -f docker/docker-compose.yml --project-directory . config
        docker compose -f docker/docker-compose.yml --project-directory . build

  # Ensure all 4 jobs pass before merge
  all-checks-pass:
    needs: [test-backend, test-frontend, security-scan, docker-build]
    runs-on: ubuntu-latest
    steps:
    - name: All checks passed
      run: echo "✅ All CI checks passed!"
