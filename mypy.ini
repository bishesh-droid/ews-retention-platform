[mypy]
# SQLAlchemy plugin resolves Base class and Column[T] type issues
plugins = sqlalchemy.ext.mypy.plugin

# Pre-0.980 behaviour: treat `arg: T = None` as `arg: Optional[T] = None`
implicit_optional = True

# Suppress missing-stub noise for packages that don't ship py.typed
ignore_missing_imports = True

# Don't require every internal function to be annotated
disallow_untyped_defs = False
check_untyped_defs = False

# Silence the many "return type Any" notes from third-party libs
warn_return_any = False

# Keep the useful checks on
warn_unused_ignores = False
warn_redundant_casts = True

# Per-module overrides -------------------------------------------------------

# SQLAlchemy models use legacy Column() style without Mapped[] type annotations
# on relationships. The plugin's [misc] inference warnings are expected here.
[mypy-backend.database.models.*]
disable_error_code = misc

# bleach has no stubs; suppress at module level too
[mypy-bleach.*]
ignore_missing_imports = True

[mypy-slowapi.*]
ignore_missing_imports = True

[mypy-fpdf.*]
ignore_missing_imports = True

[mypy-google.*]
ignore_missing_imports = True

[mypy-anthropic.*]
ignore_missing_imports = True

[mypy-xgboost.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-joblib.*]
ignore_missing_imports = True

[mypy-aiosmtplib.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True
