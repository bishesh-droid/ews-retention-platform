[tool:pytest]
# pytest configuration for EWS Retention Platform

testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Environment variables for testing
env =
    TESTING=true
    ENVIRONMENT=development
    DATABASE_URL=sqlite:///:memory:
    SECRET_KEY=test-secret-key-min-32-chars-for-testing-only
    INTEGRATION_API_KEY_HASH=

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    critical: marks tests as critical path tests

# Coverage settings (requires pytest-cov)
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
