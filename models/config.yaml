model:
  type: ensemble
  path: saved_models/ensemble_v2.0.pkl
  version: "v2.0"
  individual_models:
    - random_forest
    - xgboost
    - lightgbm
    - catboost
    - gradient_boosting
    - mlp
  features: 28
training:
  test_size: 0.2
  random_state: 42
  train_semester: "Trimester 1"
  test_semester: "Trimester 2"
  class_balancing: smote_tomek
  hyperparameter_tuning: optuna
  optuna_trials: 50
  cv_folds: 5
  scoring_metric: roc_auc
